worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	sendfile      on;
	server_tokens off;

	# Uploaded avatars are capped at 2MB by the backend; leave headroom so the
	# proxy is never the thing that rejects them.
	client_max_body_size 8m;

	log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
	                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
	access_log  /var/log/nginx/access.log  main;

	# There is no plain-HTTP listener at all: TLS is the only way in.
	server {
		listen 443 ssl;
		listen [::]:443 ssl;
		http2 on;
		server_name _;
		absolute_redirect off;

		ssl_certificate     /etc/nginx/certs/server.crt;
		ssl_certificate_key /etc/nginx/certs/server.key;

		ssl_protocols       TLSv1.2 TLSv1.3;
		ssl_ciphers         HIGH:!aNULL:!MD5;
		ssl_prefer_server_ciphers off;
		ssl_session_cache   shared:SSL:10m;
		ssl_session_timeout 10m;

		# The frontend and the API share one origin, which is what makes the auth
		# cookies same-site and removes the need for CORS entirely.
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		# Django reads this to know the original request was HTTPS; without it
		# request.is_secure() is False behind the proxy and it would build http://
		# URLs and refuse to set Secure cookies.
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host  $host;

		# The location below requires a trailing slash, so a bare /admin would
		# fall through to Next.js and 404. Django's own APPEND_SLASH never gets
		# the chance to fix it because the request never reaches Django.
		location = /admin {
			return 301 /admin/;
		}

		location = /api {
			return 301 /api/;
		}

		location = /api/health {
			return 308 /api/health/;
		}

		location = /api/status {
			return 308 /api/status/;
		}

		# Dedicated status microservice. These exact routes must be declared
		# before the general Django API location below.
		location = /api/health/ {
			proxy_pass http://status:8000;
			proxy_redirect off;
		}

		location = /api/status/ {
			proxy_pass http://status:8000;
			proxy_redirect off;
		}

		# Mailpit's web UI. Development only: it holds every message the app has
		# sent, including password-reset links, so it must not be published on a
		# real deployment. MP_WEBROOT makes Mailpit emit /mailpit/-prefixed asset
		# paths so the SPA works under this location.
		# Mailpit normalises /mailpit/ to /mailpit, so the exact path has to be
		# proxied too or that redirect lands on the frontend and 404s.
		location = /mailpit {
			proxy_pass http://mailpit:8025;
		}

		location ^~ /mailpit/ {
			proxy_pass http://mailpit:8025;
			proxy_set_header Upgrade    $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_http_version 1.1;
		}

		# Public API (FastAPI). Declared before the Django block and with `^~`:
		# nginx gives a `^~` prefix match priority over regular expressions, so
		# /api/v1/* reaches the public service while everything else under /api/
		# still goes to Django.
		location ^~ /api/v1/ {
			proxy_pass http://public_api:8000;
			proxy_redirect off;
		}

		# Django: API, admin, and user-uploaded media.
		location ~ ^/(api|admin|static|media)/ {
			proxy_pass http://backend:8000;
			proxy_redirect off;
		}

		# Django Channels: real-time game websocket.
		location ^~ /ws/ {
			proxy_pass http://backend:8000;
			proxy_http_version 1.1;
			proxy_set_header Upgrade    $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_read_timeout 86400;
		}

		# Next.js. The upgrade headers are what keep hot reload working in dev,
		# and are equally what a WebSocket feature would need later.
		location / {
			proxy_pass http://frontend:3000;
			proxy_http_version 1.1;
			proxy_set_header Upgrade    $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_read_timeout 86400;
		}
	}
}
