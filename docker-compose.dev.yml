services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    # Deliberately not published: the proxy is the only way in, so there is no
    # plain-HTTP port left for a browser to reach.
    expose:
      - "3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Empty means "same origin" — the browser calls /api/... on whatever host
      # it loaded the page from, so this never needs updating per machine.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-trascendence}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-trascendence}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db-backup:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST: ${DB_HOST:-db}
      POSTGRES_DB: ${DB_NAME:-trascendence}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-300}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups/postgres:/backups/postgres
      - ./scripts/automated_backup_db.sh:/usr/local/bin/automated_backup_db.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/automated_backup_db.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 500
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
      # Cron runs with a bare environment and sources this to get what the web
      # process receives via env_file. Mounted outside /app because /app is
      # itself a bind mount.
      - ./.env:/etc/aedlph.env:ro
    # Not published either — reachable only through the proxy.
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  public_api:
    build:
      context: ./public_api
      dockerfile: Dockerfile.dev
    env_file:
      - ./.env
    volumes:
      - ./public_api:/app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always
  # Terminates TLS and is the single entry point. Everything else talks plain
  # HTTP on the internal network only, which the subject allows.
  proxy:
    build:
      context: ./nginx
    ports:
      - "443:443"
    environment:
      # Add the machine's LAN IP here when testing from another computer, e.g.
      #   TLS_SAN=DNS:localhost,IP:127.0.0.1,IP:10.19.200.165
      TLS_SAN: ${TLS_SAN:-DNS:localhost,IP:127.0.0.1}
    volumes:
      - tls_certs:/etc/nginx/certs
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  tls_certs:
