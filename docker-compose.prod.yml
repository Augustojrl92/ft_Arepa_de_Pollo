# Production/evaluation stack: same five services as docker-compose.dev.yml,
# but every service builds its Dockerfile.prod (no --reload / next dev, no
# bind-mounted source) so the app runs as an immutable, built image — see
# CLAUDE.md for why that matters (console warnings, HMR full-stack refresh,
# volatile dev asset URLs all disappear once nothing runs `next dev`).
#
# A distinct project name keeps this stack's containers/networks/volumes from
# colliding with docker-compose.dev.yml if both are ever brought up on the
# same machine.
name: aedlph-prod

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Empty means "same origin" — see docker-compose.dev.yml for why this
        # never needs to change per machine.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    expose:
      - "3000"
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-trascendence}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-trascendence}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db-backup:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST: ${DB_HOST:-db}
      POSTGRES_DB: ${DB_NAME:-trascendence}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-300}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups/postgres:/backups/postgres
      - ./scripts/automated_backup_db.sh:/usr/local/bin/automated_backup_db.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/automated_backup_db.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Kept for evaluation convenience (password reset / verification email need
  # somewhere to land without a real mailbox). Not published on a host port
  # either way — reachable only through the proxy at /mailpit/, same as dev.
  # Point EMAIL_HOST elsewhere in .env for a real SMTP provider instead.
  mailpit:
    image: axllent/mailpit:latest
    expose:
      - "8025"
      - "1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 500
      MP_WEBROOT: /mailpit/
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - ./.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      # Cron runs with a bare environment and sources this to get what the web
      # process receives via env_file (see entrypoint.sh). Not a source mount.
      - ./.env:/etc/aedlph.env:ro
      # User-uploaded avatars (MEDIA_ROOT) must survive image rebuilds even
      # though the app source itself is baked into the image, not mounted.
      - media_data:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: always

  status:
    build:
      context: ./status_service
      dockerfile: Dockerfile.prod
    env_file:
      - ./.env
    environment:
      STATUS_BACKEND_URL: ${STATUS_BACKEND_URL:-http://backend:8000}
      STATUS_FRONTEND_URL: ${STATUS_FRONTEND_URL:-http://frontend:3000/frontend-health.txt}
      STATUS_PUBLIC_API_URL: ${STATUS_PUBLIC_API_URL:-http://public_api:8000/api/v1/health}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      STATUS_CHECK_TIMEOUT_SECONDS: ${STATUS_CHECK_TIMEOUT_SECONDS:-2}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  public_api:
    build:
      context: ./public_api
      dockerfile: Dockerfile.prod
    env_file:
      - ./.env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      PUBLIC_API_RATE_LIMIT_WINDOW_SECONDS: ${PUBLIC_API_RATE_LIMIT_WINDOW_SECONDS:-60}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  proxy:
    build:
      context: ./nginx
    ports:
      # Host port is unprivileged: evaluation machines refuse to bind low ports.
      # nginx still listens on 443 inside the container.
      - "${HTTPS_PORT:-8443}:443"
    environment:
      TLS_SAN: ${TLS_SAN:-DNS:localhost,IP:127.0.0.1}
    volumes:
      - tls_certs:/etc/nginx/certs
    depends_on:
      - frontend
      - backend
      - status
      - public_api
      - mailpit
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  tls_certs:
  media_data:
